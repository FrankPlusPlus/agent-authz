[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-authz"
version = "0.7.0b7"
description = "A secure-by-default authorization PEP for APIs, Agent tools, RAG, and tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Authz Contributors"}]
keywords = ["agent", "authorization", "rbac", "abac", "policy", "rag", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FrankPlusPlus/agent-authz"
Source = "https://github.com/FrankPlusPlus/agent-authz"
Issues = "https://github.com/FrankPlusPlus/agent-authz/issues"
Documentation = "https://github.com/FrankPlusPlus/agent-authz/tree/main/docs"
Changelog = "https://github.com/FrankPlusPlus/agent-authz/blob/main/CHANGELOG.md"

[project.optional-dependencies]
casbin = [
    "casbin>=1.36,<2",
]
fastapi = [
    "fastapi>=0.110,<1",
]
mcp = [
    "mcp>=2,<3",
]
redis = [
    "redis>=5,<7",
]
dev = [
    "build>=1.2",
    "casbin>=1.36,<2",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "pytest>=8.0",
    "twine>=6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "redis_e2e: requires AUTHZ_REDIS_URL and a real Redis-compatible server",
]

[tool.setuptools]
include-package-data = false
packages = ["authz_sdk", "authz_sdk.integrations"]
package-dir = {authz_sdk = "."}

[tool.setuptools.package-data]
authz_sdk = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "**/__pycache__/*", "*.pyc", "**/*.pyc"]
authz_sdk = ["__pycache__/*", "**/__pycache__/*", "*.pyc", "**/*.pyc"]
"authz_sdk.integrations" = ["__pycache__/*", "*.pyc"]
