name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check installed dependency metadata
        run: python -m pip check
      - name: Build clean wheel and source distribution
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf build dist agent_authz_sdk.egg-info
          python -m build
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke-install wheel and source distribution
        run: |
          python -m venv /tmp/agent-authz-wheel
          /tmp/agent-authz-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/agent-authz-wheel/bin/python -c "from importlib.metadata import version; import authz_sdk; assert authz_sdk.__version__ == version('agent-authz-sdk')"
          python -m venv /tmp/agent-authz-sdist
          /tmp/agent-authz-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          /tmp/agent-authz-sdist/bin/python -c "from importlib.metadata import version; import authz_sdk; assert authz_sdk.__version__ == version('agent-authz-sdk')"
